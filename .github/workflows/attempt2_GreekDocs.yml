# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - GreekDocs

on:
  push:
    branches:
      - attempt2
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://sampleappaoaichatgpt1.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_a5d3ef6044c2400ab7f2a71d0e3e6e87 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_220e8014d0bf42a1a12f981462a2d35e }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: sampleappaoaichatgpt1.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_a5d3ef6044c2400ab7f2a71d0e3e6e87 }}/sampleappaoaichatgpt.azurecr.io/sample-app-aoai-chatgpt:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'GreekDocs'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_367ce99f3761468d96c8091dca9f61d6 }}
        images: 'sampleappaoaichatgpt1.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_a5d3ef6044c2400ab7f2a71d0e3e6e87 }}/sampleappaoaichatgpt.azurecr.io/sample-app-aoai-chatgpt:${{ github.sha }}'